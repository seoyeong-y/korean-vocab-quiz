spring:
  application:
    name: korean-vocab-quiz-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/korean_vocab_quiz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

gemini:
  api-key: ${GEMINI_API_KEY:}
  vision-model: ${GEMINI_VISION_MODEL:gemini-2.5-flash}
